<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tab Recorder — Firefox</title>
  <link rel="stylesheet" href="../popup/popup.css" />
  <style>
    .recorder-shell { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .recorder-target { font-weight: 600; font-size: 13px; word-break: break-all; }
    .recorder-status { font-size: 12px; color: #667; min-height: 16px; }
    .recorder-timer { font-size: 22px; font-weight: 700; text-align: center; }
    .recorder-size  { font-size: 12px; text-align: center; color: #556; }
    .recorder-row   { display: flex; gap: 8px; align-items: center; }
    #btn-rec-start, #btn-rec-stop { width: 100%; padding: 10px; font-size: 14px; }
    label.mic-opt { font-size: 13px; display: flex; gap: 6px; align-items: center; }
  </style>
</head>
<body data-state="IDLE">
  <div class="recorder-shell">
    <div id="rec-target" class="recorder-target">Tab Recorder (Firefox)</div>

    <div id="panel-idle">
      <label class="mic-opt">
        <input type="checkbox" id="rec-mic-check" />
        <span>Include microphone</span>
      </label>
      <button id="btn-rec-start" class="btn btn-primary" disabled>Start recording</button>
    </div>

    <div id="panel-recording" hidden>
      <div id="rec-timer" class="recorder-timer">00:00:00</div>
      <div id="rec-size" class="recorder-size">0 B</div>
      <button id="btn-rec-stop" class="btn btn-danger">Stop and save</button>
    </div>

    <div id="rec-error" class="error-text" hidden></div>
    <div id="rec-status" class="recorder-status"></div>
    <pre id="rec-diag" style="font-size:11px; max-height:160px; overflow:auto;"></pre>
  </div>
  <script type="module" src="recorder.js"></script>
</body>
</html>
